<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchman Counseling - Instagram Posts</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #1a4d5c;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-download-all {
            background: #1a4d5c;
            color: white;
        }

        .btn-download-all:hover {
            background: #0d2a32;
        }

        /* ── Grid ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Post + caption wrapper ── */
        .post-wrap {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* ── THE POST — 4:5 portrait ── */
        .post {
            aspect-ratio: 4 / 5;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .post:hover {
            transform: translateY(-4px);
        }

        .post-content {
            max-width: 85%;
        }

        .post-text {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .post-scripture {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.85;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid currentColor;
        }

        .btn-download {
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 4px;
            background: rgba(255,255,255,0.2);
            color: inherit;
            border: 1px solid currentColor;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .post:hover .btn-download {
            opacity: 1;
        }

        /* ── Caption panel ── */
        .caption-panel {
            background: #fff;
            border-radius: 0 0 12px 12px;
            border: 1px solid #e0e0e0;
            border-top: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 18px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .caption-summary {
            font-size: 13px;
            color: #2a2a2a;
            line-height: 1.6;
        }

        .caption-scripture {
            font-size: 12px;
            font-style: italic;
            font-weight: 600;
            color: #1a4d5c;
            line-height: 1.5;
        }

        .caption-cta {
            font-size: 12px;
            color: #444;
            line-height: 1.5;
        }

        .caption-tags {
            font-size: 11.5px;
            color: #2a6e7e;
            line-height: 1.7;
            font-weight: 500;
        }

        .btn-copy {
            align-self: flex-start;
            margin-top: 2px;
            padding: 6px 14px;
            background: #1a4d5c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy:hover { background: #0d2a32; }
        .btn-copy.copied { background: #4a6b5c; }

        /* ── Original color variants — unchanged ── */
        .bg-teal      { background: linear-gradient(135deg, #1a4d5c 0%, #2a6e7e 100%); color: white; }
        .bg-slate     { background: linear-gradient(135deg, #3d4a5c 0%, #5a6f85 100%); color: white; }
        .bg-sage      { background: linear-gradient(135deg, #4a6b5c 0%, #6a8f7d 100%); color: white; }
        .bg-warmstone { background: linear-gradient(135deg, #5a4a3a 0%, #7a6a5a 100%); color: #fff5f0; }
        .bg-deepblue  { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8f 100%); color: white; }
        .bg-coastal   { background: linear-gradient(135deg, #2a5a6f 0%, #4a8aaf 100%); color: white; }
        .bg-bronze    { background: linear-gradient(135deg, #6a4a3a 0%, #8a6a5a 100%); color: #fff5f0; }
        .bg-forest    { background: linear-gradient(135deg, #2a4a3a 0%, #4a7a5a 100%); color: white; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .post-text { font-size: 20px; }
        }
    </style>
</head>

            {
                text: "Your worth is not tied to your productivity. You are enough, exactly as you are.",

        function renderPosts() {
            const grid = document.getElementById('postsGrid');
            grid.innerHTML = posts.map((post, idx) => `
                <div class="post-wrap">
                    <div class="post ${post.bg}" id="post-${idx}">
                        <div class="post-content">
                            <div class="post-text">${post.text}</div>
                            <div class="post-scripture">${post.scripture}</div>
                        </div>
                        <button class="btn-download" onclick="downloadPost(${idx})">📥 Download</button>
                    </div>
                    <div class="caption-panel">
                        <div class="caption-summary">${post.summary}</div>
                        <div class="caption-scripture">${post.verse}</div>
                        <div class="caption-cta">${post.cta}</div>
                        <div class="caption-tags">${post.tags}</div>
                        <button class="btn-copy" onclick="copyCaption(this, ${idx})">Copy Caption</button>
                    </div>
                </div>
            `).join('');
        }

        function copyCaption(btn, idx) {
            const p = posts[idx];
            const text = `${p.summary}\n\n${p.verse}\n\n${p.cta}\n\n${p.tags}`;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Caption';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        async function downloadPost(index) {
            const el = document.getElementById('post-' + index);
            const w  = el.offsetWidth;
            const scale = Math.max(1, 1080 / w);

            const btn = el.querySelector('.btn-download');
            btn.style.opacity = '0';

            const canvas = await html2canvas(el, {
                backgroundColor: null,
                scale: scale,
                logging: false,
                useCORS: true,
                allowTaint: true,
                width: w,
                height: el.offsetHeight
            });

            btn.style.opacity = '';

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'watchman-post-' + String(index + 1).padStart(2, '0') + '.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function downloadAllPosts() {
            const btn = document.querySelector('.btn-download-all');
            btn.textContent = 'Preparing…';
            btn.disabled = true;

            for (let i = 0; i < posts.length; i++) {
                btn.textContent = `Downloading ${i + 1} / ${posts.length}…`;
                await downloadPost(i);
                await new Promise(r => setTimeout(r, 700));
            }

            btn.textContent = '✓ All 20 Downloaded';
            setTimeout(() => {
                btn.textContent = '📥 Download All 20 Posts';
                btn.disabled = false;
            }, 3000);
        }

        renderPosts();
    </script>
</body>
